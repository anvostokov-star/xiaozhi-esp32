name: Build Boards

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build quandong-s3-dev-2-8-lcd
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: lcdwiki-es3c28p
          VARIANT: default
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name "$VARIANT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_quandong-s3-dev-2-8-lcd_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
